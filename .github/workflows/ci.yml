name: Glue CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  glue-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Syntax check Glue script
      - name: Syntax check Glue script
        run: |
          python -m py_compile glue_job.py

      # 4️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # 5️⃣ Upload Glue script to S3
      - name: Upload Glue script to S3
        run: |
          aws s3 cp glue_job.py \
            s3://airport-airline-operations-analytics-platform/scripts/glue_job.py

      # 6️⃣ Deploy Glue Job Stack
      - name: Deploy Glue Job Stack
        run: |
          aws cloudformation deploy \
            --stack-name glue-cicd-stack \
            --template-file template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ScriptBucket=airport-airline-operations-analytics-platform \
              ScriptKey=scripts/glue_job.py

      # 7️⃣ Start Glue Job
      - name: Start Glue Job
        id: start_glue
        run: |
          JOB_RUN_ID=$(aws glue start-job-run \
            --job-name "Final Glue" \
            --query JobRunId \
            --output text)

          echo "JOB_RUN_ID=$JOB_RUN_ID" >> $GITHUB_ENV
          echo "Started Glue Job: $JOB_RUN_ID"

      # 8️⃣ WAIT till Glue Job SUCCESS / FAIL
      - name: Wait for Glue Job to finish
        run: |
          echo "Waiting for Glue Job to finish..."

          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name "Final Glue" \
              --run-id "$JOB_RUN_ID" \
              --query 'JobRun.JobRunState' \
              --output text)

            echo "Current Glue Job status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Glue Job SUCCESS"
              break
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Glue Job FAILED"
              exit 1
            fi

            sleep 30
          done

      # 9️⃣ Deploy Crawlers Stack
      - name: Deploy Glue Crawlers Stack
        run: |
          aws cloudformation deploy \
            --stack-name glue-crawlers-stack \
            --template-file crawler-template.yaml \
            --capabilities CAPABILITY_NAMED_IAM

      # 🔟 Run Crawlers
      - name: Run Glue Crawlers
        run: |
          aws glue start-crawler --name airline || echo "airline already running"
          aws glue start-crawler --name customers || echo "customers already running"

      # 1️⃣1️⃣ WAIT till Crawlers finish
      - name: Wait for Crawlers
        run: |
          for crawler in airline customers; do
            echo "Waiting for crawler: $crawler"

            while true; do
              STATE=$(aws glue get-crawler \
                --name $crawler \
                --query 'Crawler.State' \
                --output text)

              echo "$crawler state: $STATE"

              if [ "$STATE" = "READY" ]; then
                echo "$crawler completed"
                break
              fi

              sleep 20
            done
          done

      # ✅ Done
      - name: Pipeline Completed
        run: echo "Glue Job + Crawlers completed successfully 🎉"
