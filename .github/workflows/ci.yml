name: Glue CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  glue-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Python (Glue compatible)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Syntax check Glue script
      - name: Syntax check Glue script
        run: |
          python -m py_compile glue_job.py

      # 4️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # 5️⃣ Upload Glue script to S3
      - name: Upload Glue script to S3
        run: |
          aws s3 cp glue_job.py \
            s3://airport-airline-operations-analytics-platform/scripts/glue_job.py

      # 6️⃣ Deploy Glue Job (CloudFormation)
      - name: Deploy Glue Job Stack
        run: |
          aws cloudformation deploy \
            --stack-name glue-cicd-stack \
            --template-file template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ScriptBucket=airport-airline-operations-analytics-platform \
              ScriptKey=scripts/glue_job.py

      # 7️⃣ Start Glue Job (SAFE – no concurrent run error)
      - name: Start Glue Job (safe)
        run: |
          echo "Checking running Glue jobs..."

          RUNNING_COUNT=$(aws glue get-job-runs \
            --job-name "Final Glue" \
            --max-results 5 \
            --query "JobRuns[?JobRunState=='RUNNING'] | length(@)" \
            --output text)

          if [ "$RUNNING_COUNT" -gt 0 ]; then
            echo "Glue job already RUNNING, waiting..."
          else
            echo "Starting new Glue job..."
            aws glue start-job-run --job-name "Final Glue"
          fi

      # 8️⃣ Wait until Glue Job SUCCESS / FAIL
      - name: Wait for Glue Job to finish
        run: |
          echo "Waiting for Glue Job to finish..."

          while true; do
            STATUS=$(aws glue get-job-runs \
              --job-name "Final Glue" \
              --max-results 1 \
              --query 'JobRuns[0].JobRunState' \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Glue Job SUCCESS"
              break
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Glue Job FAILED"
              exit 1
            fi

            sleep 30
          done

      # 9️⃣ Start Crawlers (after Glue SUCCESS)
      - name: Run Glue Crawlers
        run: |
          aws glue start-crawler --name airline || echo "airline already running"
          aws glue start-crawler --name customers || echo "customers already running"

      # 🔟 Wait for Crawlers to finish
      - name: Wait for Crawlers
        run: |
          for crawler in airline customers; do
            echo "Waiting for crawler: $crawler"
            while true; do
              state=$(aws glue get-crawler \
                --name $crawler \
                --query 'Crawler.State' \
                --output text)

              if [ "$state" = "READY" ]; then
                echo "$crawler finished"
                break
              fi

              sleep 20
            done
          done
