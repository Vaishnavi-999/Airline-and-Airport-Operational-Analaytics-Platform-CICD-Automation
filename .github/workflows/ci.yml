name: Glue CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  glue-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Syntax check
      - name: Syntax check Glue script
        run: |
          python -m py_compile glue_job.py

      # 4️⃣ AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # 5️⃣ Upload script
      - name: Upload Glue script to S3
        run: |
          aws s3 cp glue_job.py \
            s3://airport-airline-operations-analytics-platform/scripts/glue_job.py

      # 6️⃣ Deploy Glue Job
      - name: Deploy Glue Job Stack
        run: |
          aws cloudformation deploy \
            --stack-name glue-cicd-stack \
            --template-file template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ScriptBucket=airport-airline-operations-analytics-platform \
              ScriptKey=scripts/glue_job.py

      # 7️⃣ Start Glue Job (safe)
      - name: Start Glue Job
        run: |
          RUNNING_COUNT=$(aws glue get-job-runs \
            --job-name "Final Glue" \
            --query "JobRuns[?JobRunState=='RUNNING'] | length(@)" \
            --output text)

          if [ "$RUNNING_COUNT" -eq 0 ]; then
            echo "Starting Glue job"
            aws glue start-job-run --job-name "Final Glue"
          else
            echo "Glue job already running"
          fi

      # 8️⃣ Wait for Glue Job SUCCESS / FAIL
      - name: Wait for Glue Job
        run: |
          while true; do
            STATUS=$(aws glue get-job-runs \
              --job-name "Final Glue" \
              --max-results 1 \
              --query 'JobRuns[0].JobRunState' \
              --output text)

            echo "Glue Job status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Glue Job SUCCESS"
              break
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Glue Job FAILED"
              exit 1
            fi

            sleep 30
          done

      # 9️⃣ Run Crawlers
      - name: Run Glue Crawlers
        run: |
          aws glue start-crawler --name airline || echo "airline already running"
          aws glue start-crawler --name customers || echo "customers already running"

      # 🔟 Wait for Crawlers & CHECK SUCCESS
      - name: Wait for Crawlers (FAIL if crawler failed)
        run: |
          for crawler in airline customers; do
            echo "Waiting for crawler: $crawler"

            while true; do
              STATE=$(aws glue get-crawler \
                --name $crawler \
                --query 'Crawler.State' \
                --output text)

              if [ "$STATE" = "READY" ]; then
                LAST_STATUS=$(aws glue get-crawler \
                  --name $crawler \
                  --query 'Crawler.LastCrawl.Status' \
                  --output text)

                echo "$crawler last run status: $LAST_STATUS"

                if [ "$LAST_STATUS" != "SUCCEEDED" ]; then
                  echo "$crawler FAILED"
                  exit 1
                fi

                echo "$crawler SUCCESS"
                break
              fi

              sleep 20
            done
          done

      # ✅ END
      - name: Pipeline Success
        run: echo "Glue Job + Crawlers completed SUCCESSFULLY 🎉"
